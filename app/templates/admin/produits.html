{% extends 'base.html' %}
{% block content %}
<h2>🛠 Gérer les produits</h2>

<form method="post" class="mb-4">
    <input name="nom" class="form-control mb-2" placeholder="Nom du produit" required>
    <textarea name="description" class="form-control mb-2" placeholder="Description"></textarea>
    <input name="image" class="form-control mb-2" placeholder="Nom du fichier image (ex: ps5.jpg)">
    <button class="btn btn-primary">Ajouter</button>
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Nom</th>
            <th>Description</th>
            <th>Image</th>
        </tr>
    </thead>
    <tbody>
    {% for produit in produits %}
        <tr>
            <td>{{ produit.nom }}</td>
            <td>{{ produit.description }}</td>
            <td><img src="{{ url_for('static', filename='images/' + produit.image_url) }}" width="80"></td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
