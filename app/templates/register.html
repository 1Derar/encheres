{% extends 'base.html' %}{% block content %}
<h2>Créer un compte</h2>
<form method="post" class="w-50 mx-auto">
    <input name="nom" class="form-control mb-3" placeholder="Nom" required>
    <input name="email" class="form-control mb-3" placeholder="Email" required>
    <input name="password" type="password" class="form-control mb-3" placeholder="Mot de passe" required>
    <button class="btn btn-success w-100">S'inscrire</button>
</form>
{% endblock %}
