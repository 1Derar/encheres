{% extends 'base.html' %}{% block content %}
<h2>🎯 Enchères en cours</h2>
<div class="row">
  {% for enchere in encheres %}
  <div class="col-md-6 mb-4">
    <div class="card">
      <a href="{{ url_for('views.detail_enchere', enchere_id=enchere.id) }}">
        <img src="{{ url_for('static', filename='images/' + enchere.produit.image_url) }}" class="card-img-top" alt="{{ enchere.produit.nom }}">
      </a>
      <div class="card-body">
        <h5 class="card-title">{{ enchere.produit.nom }}</h5>
        <p class="card-text">{{ enchere.produit.description }}</p>
        <p>🪙 {{ enchere.jetons_par_mise }} jetons</p>
        <p>⏰ Jusqu’au {{ enchere.date_fin.strftime('%d/%m/%Y %H:%M') }}</p>
        <a href="{{ url_for('views.detail_enchere', enchere_id=enchere.id) }}" class="btn btn-primary">Miser</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
